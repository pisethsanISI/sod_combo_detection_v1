[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sod-combination-detection"
version = "0.1.0"
description = "SOD combination-rule (N-function) detector for SAP -- PDF + Excel report by module"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "ISI Group" }]
dependencies = ["reportlab>=4.0", "openpyxl>=3.1"]

[project.scripts]
combo-detect = "combo_detection.cli:main"
combo-check-drift = "combo_detection.drift_check:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
